services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: template_ninja
      POSTGRES_USER: template_ninja
      POSTGRES_PASSWORD: template_ninja
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template_ninja -d template_ninja"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
