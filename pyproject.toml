[project]
name = "template-ninja"
version = "0.1.0"
description = "Django service-layer template: Ninja, Pydantic DTO, services, PostgreSQL"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "bcrypt>=5.0.0",
    "django>=6.1,<6.2",
    "django-healthchecks>=1.5,<2",
    "django-ninja>=1.7,<2",
    "psycopg[binary]>=3.3.8",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "pytest>=8",
    "pytest-django>=4.11",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "src.config.settings"
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
